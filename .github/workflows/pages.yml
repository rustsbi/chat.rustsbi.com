name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out site
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out RustSBI Agent documents
        uses: actions/checkout@v5
        with:
          repository: rustsbi/Agent
          ref: 7211dba8c60e9bd704b2fd0d6c6e56defae87de2
          path: agent-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build knowledge index
        run: |
          python -m pip install pypdfium2==5.15.2
          python scripts/index-agent.py agent-source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
